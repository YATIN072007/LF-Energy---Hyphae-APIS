name: Unit Tests

on:
  push:
    branches: [ "add-license-1", "main", "master" ]
  pull_request:
    branches: [ "add-license-1", "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run Maven Tests (Java Modules)
      run: |
        set -e
        # apis-bom is just dependencies, no tests
        # apis-common
        if [ -d "apis-common" ]; then
          cd apis-common && mvn test
        fi
        cd ..
        # apis-main
        if [ -d "apis-main" ]; then
          cd apis-main && mvn test
        fi
        cd ..
        # apis-ccc
        if [ -d "apis-ccc" ]; then
          cd apis-ccc && mvn test
        fi
        cd ..
        # apis-log
        if [ -d "apis-log" ]; then
          cd apis-log && mvn test
        fi
        cd ..
        # apis-web
        if [ -d "apis-web" ]; then
          cd apis-web && mvn test
        fi
        cd ..

    - name: Run Python Tests
      run: |
        set -e
        python -m pip install --upgrade pip
        pip install pytest

        # apis-emulator
        if [ -d "apis-emulator" ] && [ -f "apis-emulator/requirements.txt" ]; then
          cd apis-emulator
          pip install -r requirements.txt
          python -m pytest || if [ $? -eq 1 ]; then exit 1; fi
        fi
        cd ..
        
        # apis-main_controller
        if [ -d "apis-main_controller" ] && [ -f "apis-main_controller/requirements.txt" ]; then
          cd apis-main_controller
          pip install -r requirements.txt
          python -m pytest || if [ $? -eq 1 ]; then exit 1; fi
        fi
        cd ..
        
        # apis-tester
        if [ -d "apis-tester" ] && [ -f "apis-tester/requirements.txt" ]; then
          cd apis-tester
          pip install -r requirements.txt
          python -m pytest || if [ $? -eq 1 ]; then exit 1; fi
        fi
        cd ..
